baseURL = "https://go-agentsync.github.io/"
title = "go-agentsync"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

# The design comes from the shared Hugo module
# github.com/go-fleettools/landingkit (version pinned in go.mod, kept by kit.go).
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 7.61:1, bright on the dark background 3.96:1.
  base = "#005a7d"
  deep = "#00374c"
  bright = "#0079a8"
  shadow = "rgba(0,90,125,.7)"
  glow = "rgba(0,90,125,.6)"
  wash = "rgba(0,90,125,.10)"
  washDeep = "rgba(0,55,76,.06)"
  chipBg = "#e0eff5"
  chipBorder = "#b2d7e5"
  chipFg = "#00374c"
  chipBgDark = "rgba(0,121,168,.14)"
  chipBorderDark = "rgba(0,121,168,.32)"
  chipFgDark = "#73b5cf"
  statsEnd = "#c2dfea"
  bandText = "#d6eaf1"
  accent = "#005a7d"
  accentDark = "#1484af"

# One card per repository. "tag" is the newest tag when this was written; the
# repository's own tag list is the authority and the card links there.
[[params.modules]]
  name = "agentscope"
  tag = "v0.15.2"
  blurb = "A live graphical view of the Claude Code agent network on this machine: sessions, sub-agents, tasks, repositories and the messages between them. Read-only, loopback only."
[[params.modules]]
  name = "agentsync"
  tag = "v0.13.1"
  blurb = "Coordination for many agent sessions on one machine: claims on a repository, messages between sessions, and a memory index."

# What changed in agentscope, newest first. One line each; the detail is in the
# release notes the card links to.
[[params.releases]]
  tag = "v0.15.2"
  what = "The capture help no longer says a WebM needs a multiple of 16: any size works, and v0.15.1 (avkit v0.20.2) pads internally."
[[params.releases]]
  tag = "v0.15.0"
  what = "agentscope capture --format webm records the demo as a WebM video, for the platforms that take video only."
[[params.releases]]
  tag = "v0.14.2"
  what = "The capture demo is 8 to 16 times smaller (glyphs drawn once, then reused); a nil message is refused, not a crash."
[[params.releases]]
  tag = "v0.14.1"
  what = "The capture demo no longer clips header or graph text, and reaches the connected state."
[[params.releases]]
  tag = "v0.14.0"
  what = "agentscope capture records a scenario as one animated SVG."
[[params.releases]]
  tag = "v0.13.2"
  what = "Tests only: the wire client and hub are covered to 100%."
[[params.releases]]
  tag = "v0.13.1"
  what = "The texts built from the data are translated: details, ages and anomaly kinds."
[[params.releases]]
  tag = "v0.13.0"
  what = "A Theme selector (System, Light, Dark) and a Language selector (Auto, English, French)."
[[params.releases]]
  tag = "v0.12.0"
  what = "Each account's colour is editable from the quota view, kept in account-colors.toml."

[params.mantra]
  goarch = ["amd64"]
  items = ["LICENSE=BSD-3-Clause", "CGO_ENABLED=0"]

[[params.cta]]
  kind  = "docs"
  href  = "https://github.com/go-agentsync/agentscope#readme"
  label = "Read the agentscope README →"
